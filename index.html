<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ta-Te-Ti | Tres en Raya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ta-Te-Ti</h1>
        
        <div class="mode-selector">
            <button id="btn-pvp" class="mode-btn active">👥 Jugador vs Jugador</button>
            <button id="btn-pve" class="mode-btn">🤖 Jugador vs Computadora</button>
        </div>

        <div class="scoreboard">
            <div class="score player-x">
                <span class="label">Jugador X</span>
                <span class="score-value" id="score-x">0</span>
            </div>
            <div class="score draws">
                <span class="label">Empates</span>
                <span class="score-value" id="score-draws">0</span>
            </div>
            <div class="score player-o">
                <span class="label">Jugador O</span>
                <span class="score-value" id="score-o">0</span>
            </div>
        </div>

        <div class="status" id="status">Turno de <span class="current-player">X</span></div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="restart-btn" id="restart-btn">🔄 Nueva Partida</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
